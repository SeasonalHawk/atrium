# PRD v5 Section 14: minimal CI. Lint + build for the funnel and console on
# every push. Does not deploy — the funnel deploys to Vercel separately, the
# console/launcher/crew run on the operator workstation.
name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
