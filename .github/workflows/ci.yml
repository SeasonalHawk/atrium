# PRD v5 Section 14 + Sprints 3-4: lint + build for the funnel and console,
# the Lead Engine's pytest suite, and the crew's Supabase bridge script
# tests, on every push. Does not deploy — the funnel deploys to Vercel
# separately, the console/launcher/crew/engine run on the operator
# workstation.
name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r engine/requirements.txt
      - run: python3 -m pytest engine/tests/ -v
        working-directory: engine

  crew-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test crew/scripts/*.test.mjs

  crew-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest
      - run: python3 -m pytest crew/scripts/test_*.py -v
